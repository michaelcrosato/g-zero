name: Verify source and deployment builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      # All engine and build inputs are in the repository. Do not run npm install.
      - name: Check the reproducible build and unit tests
        run: npm run check
      - name: Build hosted and offline artifacts
        run: npm run build
      - name: Verify building does not change committed artifacts
        run: git diff --exit-code -- index.html build-info.json
